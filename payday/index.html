<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dark Calendar Tracker</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f1115">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="app-container">
    <!-- Сетка верхних сумм -->
    <div class="summary-grid">
        <div class="summary-box">
            <div class="summary-title">Общая сумма</div>
            <div class="summary-amount" id="total-sum">0</div>
        </div>
        <div class="summary-box resettable" id="resettable-box">
            <div class="summary-title">Накапливаемая</div>
            <div class="summary-amount" id="resettable-sum">0</div>
        </div>
    </div>

    <!-- Область календаря -->
    <div class="calendar-section">
        <!-- Шапка: Месяц и Год -->
        <div class="header">
            <button class="nav-btn" id="prev-month">&lsaquo;</button>
            <div class="month-year-display" id="month-year-title"></div>
            <button class="nav-btn" id="next-month">&rsaquo;</button>
        </div>
        
        <!-- Сумма за выбранный месяц -->
        <div class="month-summary">Итого за месяц: <span id="month-sum">0</span></div>

        <!-- Календарь -->
        <div class="calendar-grid" id="calendar-days"></div>
    </div>

    <!-- ЭЛЕМЕНТЫ ПРИЖАТЫ К НИЗУ -->
    <div class="bottom-section">
        <!-- ТАРИФ ВО ВСЮ СТРОКУ: растягивается на 100% ширины приложения -->
        <div class="settings-row" style="display: flex; justify-content: space-between; align-items: center; margin: 0 0 4px 0; gap: 12px; width: 100%;">
            <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600; white-space: nowrap;">Текущий тариф дня:</span>
            <input type="number" id="current-rate-input" value="100" style="padding: 10px; border-radius: 10px; font-size: 1rem; text-align: center; flex-grow: 1; background: var(--card-inner); color: var(--text-color); border: 1px solid var(--border-color); outline: none;">
        </div>

        <div class="hint">Зажмите день для пометки. Нажмите и удерживайте карточку для сброса.</div>
        
        <div class="controls-grid">
            <button class="action-btn" id="open-list-btn">📜 Список дней</button>
            <button class="action-btn" id="open-backup-btn">⚙️ Бэкап данных</button>
        </div>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО 1: Список помеченных дней во весь экран -->
<div class="modal-overlay fullscreen-modal" id="list-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Помеченные дни</h3>
        </div>
        <div class="modal-body" id="marked-days-list"></div>
        <div class="modal-footer">
            <button class="action-btn" id="close-list-btn">❌ Закрыть список</button>
        </div>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО 2: Управление Бэкапами -->
<div class="modal-overlay" id="backup-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Резервное копирование</h3>
            <button class="close-modal-btn" id="close-backup-btn">&times;</button>
        </div>
        <div class="modal-body">
            <div class="backup-vertical-list">
                <button class="backup-btn-large" id="export-json">💾 Экспорт в JSON</button>
                <button class="backup-btn-large" id="export-csv">📊 Экспорт в CSV</button>
                <label class="backup-btn-large upload-label">
                    📂 Импортировать файл (JSON/CSV)
                    <input type="file" id="import-file" accept=".json,.csv" style="display: none;">
                </label>
            </div>
        </div>
    </div>
</div>

<script src="./script.js"></script>
</body>
</html>
